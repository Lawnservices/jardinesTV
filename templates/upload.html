<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subir Video | JardinTV</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<header class="navbar">

<div class="logo">
🌿 <span>JardinTV</span>
</div>


<nav>

<a href="/">🏠 Inicio</a>

<a href="/upload">📤 Subir video</a>

<a href="/watch">🎥 Videos</a>

</nav>


</header>



<section class="upload-section">


<div class="upload-card">


<h1>📤 Subir un video</h1>


<p>
Comparte tu jardín, plantas o ideas con la comunidad 🌱
</p>

<form action="/upload" method="POST" enctype="multipart/form-data">

    <label for="titulo">Título del video</label>
    <input 
        type="text"
        id="titulo"
        name="titulo"
        maxlength="200"
        placeholder="Ejemplo: Mi jardín en primavera"
        required
    >

    <label for="descripcion">Descripción</label>
    <textarea
        id="descripcion"
        name="descripcion"
        maxlength="1000"
        placeholder="Cuéntanos sobre tu jardín..."
    ></textarea>

    <label for="video">Selecciona tu video</label>
    <input 
        type="file"
        id="video"
        name="video"
        accept="video/mp4,video/webm,video/quicktime"
        required
    >

    <button class="btn" type="submit">
        🚀 Publicar video
    </button>

</form>
