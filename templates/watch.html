<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos | JardinTV</title>
<link rel="stylesheet" href="/static/style.cs">
 <style>
    /* 🔥 Contenedor del video */
    .video-wrapper {
        width: 100%;
        max-width: 450px;      /* Tamaño fijo para evitar controles gigantes */
        aspect-ratio: 9/16;    /* Videos verticales del teléfono */
        position: relative;
        margin: auto;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
    }

    /* 🔥 El video siempre se adapta sin deformarse */
    .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;     /* Ajusta el video sin deformar */
        cursor: pointer;       /* Click para reproducir */
        display: block;
    }

    /* ⭐ Controles personalizados dentro del video */
    .botones-video {
        position: absolute;
        right: 10px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .botones-video button {
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
    }

    /* ⭐ Información del video debajo */
    .video-info {
        padding: 10px;
        background: white;
        border-radius: 10px;
        margin-top: 10px;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .actions button {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: #eee;
        cursor: pointer;
    }
</style>

 
</head>

<body>

<header class="navbar">
    <div class="logo">
        🌿 <span>JardinTV</span>
    </div>

    <nav>
        <a href="/">🏠 Inicio</a>
        <a href="/upload">📤 Subir video</a>
        <a href="/watch">🎥 Videos</a>
    </nav>
</header>

<section class="videos-page">

<h1>🎥 Videos de jardines</h1>

<div class="video-feed">

{% for video in videos %}
 
  <div class="video-card video-container">

    <video 
    poster="{{ video.thumbnail }}"
    controls
    controlslist="nodownload noplaybackrate"
    disablepictureinpicture
    playsinline
    preload="metadata"
    class="short-video">
     <div class="controls">
        <!-- Tus botones personalizados -->
        <button>Play</button>
        <button>Pause</button>
    </div>
    <source src="{{ video.url_video }}" type="video/mp4">

    Tu navegador no soporta videos.

<div class="video-wrapper">

    <video id="video"></video>

    <div class="botones-video">
        <button>👍</button>
        <button>💬</button>
        <button onclick="compartir()">↗️</button>
        <button>💾</button>
    </div>

    <div class="video-info">
        <h3>🌱 {{ video.titulo }}</h3>
        <p>{{ video.descripcion }}</p>

        <div class="actions">
            <button onclick="darLike()">❤️ Like</button>
            <button>💬 comentario</button>
            <button>📤 Compartir</button>
        </div>
    </div>

</div>


{% else %}

<div class="video-empty">
    <h2>🌿 Todavía no hay videos</h2>
    <p>Sé el primero en compartir tu jardín.</p>
    <a href="/upload">📤 Subir primer video</a>
</div>

{% endfor %}

</div>

</section>

<footer>
<p>© 2026 JardinTV 🌿</p>
</footer>
<script type="module" src="/static/js/likes.js"></script>
 
</body>
</html>
