 
<link rel="stylesheet" href="{{ url_for('static', filename='watch.css') }}">
{% block content %}

    <div class="videos"> 
    <div class="video-feed">
        {% for video in videos %}
        <div class="video-container">
            <video class="short-video" poster="{{ video.thumbnail }}" playsinline webkit-playsinline muted controls
                preload="metadata">
                <source src="{{ video.url_video }}" type="video/mp4">
            </video>
            <div class="video-info">
                <h3>🌱 {{ video.titulo }}</h3>
                <p>{{ video.descripcion }}</p>
            </div>
        </div>
        {% else %}
        <div class="video-empty">
            <h2>No hay videos todavía</h2>
        </div>
        {% endfor %}
    </div>
    </div>


<script src="{{ url_for('static', filename='js/shorts.js') }}"></script>
{% endblock %}
