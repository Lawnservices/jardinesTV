 
<link rel="stylesheet" href="{{ url_for('static', filename='one.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
 <header class="navbar">
        <div class="logo">
            <span>JardinesTV</span>
        </div>
        <nav>
            <a href="/">🏠 Inicio</a>
            <a href="/upload">📤 Subir video</a>
            <a href="/watch">🎥 Shorts</a>
            <a href="/shorts">Videos</a>
        </nav>
    </header>
{% block content %}

     
    <div class="video-feed">
        {% for video in videos %}
        <div class="video-container">
            <video class="short-video" poster="{{ video.thumbnail }}" playsinline webkit-playsinline muted controls
                preload="metadata">
                <source src="{{ video.url_video }}" type="video/mp4">
            </video>
            <div class="video-info">
                <h3>🌱 {{ video.titulo }}</h3>
                <p>{{ video.descripcion }}</p>
            </div>
        </div>
        {% else %}
        <div class="video-empty">
            <h2>No hay videos todavía</h2>
        </div>
        {% endfor %}
    </div>
   


<script src="{{ url_for('static', filename='js/watch.js') }}"></script>
{% endblock %}
