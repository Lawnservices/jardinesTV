<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos | JardinTV</title>
<link rel="stylesheet" href="/static/shorts.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        🌿 <span>JardinTV</span>
    </div>

    <nav>
        <a href="/">🏠 Inicio</a>
        <a href="/upload">📤 Subir video</a>
        <a href="/watch">🎥 Videos</a>
    </nav>
</header>

<section class="videos-page">

<h1>🎥 Videos de jardines</h1>

<div class="video-feed">

{% for video in videos %}
 
<div class="video-feed">

    <div class="video-container">

        <video 
        class="video"
        poster="{{ video.thumbnail }}"
        muted
        playsinline
        preload="metadata">

            <source src="{{ video.url_video }}" type="video/mp4">

        </video>


        <div class="video-info">

            <h3>🌱 {{ video.titulo }}</h3>

            <p>{{ video.descripcion }}</p>

        </div>

    </div>

</div> 

{% else %}

<div class="video-empty">
    <h2>🌿 Todavía no hay videos</h2>
    <p>Sé el primero en compartir tu jardín.</p>
    <a href="/upload">📤 Subir primer video</a>
</div>

{% endfor %}

</div>

</section>

<footer>
<p>© 2026 JardinTV 🌿</p>
</footer>
<script type="module" src="/static/js/shorts.js"></script>
 
</body>
</html>
