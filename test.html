<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Videos Shorts</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* FEED */

        .video-feed {
            width: 100vw;
            height: 100dvh;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-snap-type: y mandatory;

            scrollbar-width: none;
        }

        .video-feed::-webkit-scrollbar {
            display: none;
        }


        /* CADA VIDEO */

        .video-container {
            position: relative;

            width: 100vw;
            height: 100dvh;

            scroll-snap-align: start;
            scroll-snap-stop: always;

            overflow: hidden;

            background: #000;
        }


        /* VIDEO */

        .short-video {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border: 0;
            margin: 0;
            padding: 0;
        }


        /* INFORMACIÓN */

        .video-info {
            position: absolute;

            left: 20px;
            right: 20px;
            bottom: 30px;

            z-index: 10;

            color: white;

            text-shadow: 0 2px 10px black;
        }

        .video-info h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .video-info p {
            margin: 0;
            font-size: 15px;
        }


        /* PC */

        @media (min-width: 769px) {

            body {
                overflow: auto;
            }

            .video-feed {
                width: 100%;
                height: auto;

                display: flex;
                flex-direction: column;
                align-items: center;

                gap: 40px;

                padding: 20px 0;

                overflow: visible;

                scroll-snap-type: none;
            }

            .video-container {
                width: 620px;
                height: 85vh;

                max-width: 90vw;

                scroll-snap-align: none;
            }

            .short-video {
                position: static;

                width: 100%;
                height: 100%;

                border-radius: 12px;
            }

            .video-info {
                position: static;

                margin-top: 10px;

                text-align: center;
            }
        }

    </style>

</head>


<body>

    <div class="video-feed">


        <!-- VIDEO 1 -->

        <div class="video-container">

            <video
                class="short-video"
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                playsinline
                webkit-playsinline
                muted
                loop
                controls
                preload="metadata">
            </video>

            <div class="video-info">

                <h3>🌱 Video 1</h3>

                <p>
                    Este video ocupa toda la pantalla.
                </p>

            </div>

        </div>


        <!-- VIDEO 2 -->

        <div class="video-container">

            <video
                class="short-video"
                src="https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4"
                playsinline
                webkit-playsinline
                muted
                loop
                controls
                preload="metadata">
            </video>

            <div class="video-info">

                <h3>🌱 Video 2</h3>

                <p>
                    Desliza hacia arriba.
                </p>

            </div>

        </div>


        <!-- VIDEO 3 -->

        <div class="video-container">

            <video
                class="short-video"
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"
                playsinline
                webkit-playsinline
                muted
                loop
                controls
                preload="metadata">
            </video>

            <div class="video-info">

                <h3>🌱 Video 3</h3>

                <p>
                    Otro video a pantalla completa.
                </p>

            </div>

        </div>


    </div>


    <script>

        const videos = document.querySelectorAll(".short-video");

        const observer = new IntersectionObserver(
            (entries) => {

                entries.forEach((entry) => {

                    const video = entry.target;

                    if (entry.isIntersecting) {

                        videos.forEach((otherVideo) => {

                            if (otherVideo !== video) {
                                otherVideo.pause();
                            }

                        });

                        video.play().catch(() => {});

                    } else {

                        video.pause();

                    }

                });

            },
            {
                threshold: 0.75
            }
        );


        videos.forEach((video) => {

            observer.observe(video);

        });

    </script>

</body>

</html>
